<title>Play&rsquo;around</title>
<link rel="stylesheet" href="estilo.css">

<!--
  A raiz do domínio abre a app.

  Antes isto era uma página de entrada mínima, feita só para o endereço não
  devolver 404 enquanto a Google Play exigia URLs públicos. Agora que o
  playaround.pt aponta para aqui, quem escreve o endereço quer a app — não um
  cartaz sobre ela. A página de entrada não se perdeu: está em `sobre.html`.

  ⚠ O redireccionamento é feito por `<meta refresh>` e não por JavaScript, para
  funcionar mesmo com o JavaScript desligado. E há um link visível por baixo,
  para quem chegue aqui com o refresh bloqueado não ficar num beco.
-->
<meta http-equiv="refresh" content="0; url=webapp/">
<link rel="canonical" href="https://playaround.pt/webapp/">
</head>
<body>

<div class="marca"></div>

<div class="folha">
  <header>
    <p class="eyebrow">Play&rsquo;around</p>
    <h1>A abrir a app&hellip;</h1>
  </header>

  <p>Se não acontecer nada em dois segundos,
  <a href="webapp/"><strong>abre aqui</strong></a>.</p>

  <div class="resumo">
    <h2>Também aqui</h2>
    <ul>
      <li><a href="sobre.html">O que é a Play&rsquo;around</a></li>
      <li><a href="privacidade.html">Política de Privacidade</a></li>
      <li><a href="apagar-conta.html">Como apagar a tua conta</a></li>
    </ul>
  </div>
</div>

</body>
</html>
